<!DOCTYPE html>
<html lang="es">

    </head>
    <body>
    <section class="ccin">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <img href="{{ url_for('inicio') }}" src="{{ url_for('static', filename='images/logo1.png') }}" alt="logo del proyecto"width="300" height="80">
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
        <a class="nav-link" href="{{ url_for('nosotros') }}">Quienes Somos</a>

      </div>
    </div>
  </div>

        <div class="CReg">
          <h1>Registro de Usuario</h1>
          <form class="registro-form" method="POST" action="{{ url_for('registro') }}">
    
            <label>Ingrese su Nombre Completo:</label>
            <input type="text" name="nombre" placeholder="Ej: Juan Pérez" required>
        
            <label>Ingrese su Correo:</label>
            <input type="email" name="correo" placeholder="Ej: ejemplo@correo.com" required>
        
            <label>Teléfono:</label>
            <input type="tel" name="telefono" placeholder="Ej: 3001234567" required>
        
        
            <label for="fecha">Ingrese su Fecha de Nacimiento:</label>
            <input type="date" name="edad" id="fecha" required>
        
            <label for="genero">Ingrese su género:</label>
            <select name="genero" id="genero" class="input-select" required>
                <option value="Hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
                <option value="Otro">Otro</option>
            </select>
        
            <label>Ingrese su Contraseña:</label>
            <input type="password" name="password" placeholder="Ej: 123456E$" required>
        
            <label>Verifique su Contraseña:</label>
            <input type="password" name="confirm_password" placeholder="Ej: 123456E$" required>
        
            <div class="terminos">
                <input type="checkbox" id="acepto" required>
                <label for="acepto">
                    Acepto los <a href="{{ url_for('terminos') }}" target="_blank">términos y condiciones</a> de TUS FINANZAS 360
                </label>
            </div>
        
            <input type="submit" value="Enviar" class="b2">
            
        </form>
      </div>
        <footer>
            <h1>
              Tus Finanzas 360
            </h1>
            <h2>
              Por Ibrahim J. Blanco P. , Juan Pablo Salamanca, Kevin Ramirez y Esteban Yanez
            </h2>
            <h3>
              Colegio Gabriel Betancourt Mejia
            </h3>
        </footer>
      </section>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
